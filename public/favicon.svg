<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ss-top" x1="7.5" y1="6.5" x2="24.5" y2="16.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="ss-left" x1="7.5" y1="11.5" x2="16" y2="25.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="ss-right" x1="16" y1="11.5" x2="24.5" y2="25.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="32" height="32" rx="7" fill="url(#ss-bg)"/>
  <rect width="32" height="32" rx="7" stroke="#334155" stroke-width="1"/>

  <!-- StockSense Isometric Inventory Cube -->
  <!-- Top Face -->
  <polygon points="16,6.5 24.5,11.5 16,16.5 7.5,11.5" fill="url(#ss-top)"/>
  
  <!-- Left Face -->
  <polygon points="7.5,11.5 16,16.5 16,25.5 7.5,20.5" fill="url(#ss-left)"/>
  
  <!-- Right Face -->
  <polygon points="16,16.5 24.5,11.5 24.5,20.5 16,25.5" fill="url(#ss-right)"/>

  <!-- Center Edge & Precision Seam -->
  <line x1="16" y1="16.5" x2="16" y2="25.5" stroke="#7C2D12" stroke-width="1"/>
  <line x1="16" y1="6.5" x2="16" y2="16.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- Precision inventory indicator marks -->
  <line x1="10" y1="18.5" x2="13.5" y2="20.5" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="18.5" y2="16" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round"/>
</svg>
